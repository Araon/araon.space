<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Swaspeak evidence: character savings do not transfer cleanly to tokens or meaning</title>
  <desc id="desc">The controlled set saved 29.72 percent of characters but only 5.45 percent of tokens. Meaning-unit coverage fell from 89.29 to 73.21 percent for Llama and from 92.86 to 91.07 percent for Qwen.</desc>
  <rect width="1200" height="720" rx="28" fill="#111113"/>
  <text x="72" y="82" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Shorter text is not automatically cheaper text</text>
  <text x="72" y="122" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="18">Swaspeak controlled-set results</text>
  <text x="72" y="188" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Compression</text>
  <text x="72" y="224" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="17">Relative reduction after textese compression</text>
  <line x1="72" y1="500" x2="1128" y2="500" stroke="#3f3f46" stroke-width="2"/>
  <line x1="72" y1="300" x2="1128" y2="300" stroke="#27272a" stroke-width="1"/>
  <line x1="72" y1="400" x2="1128" y2="400" stroke="#27272a" stroke-width="1"/>
  <rect x="180" y="302" width="220" height="198" rx="12" fill="#8b5cf6"/>
  <rect x="480" y="464" width="220" height="36" rx="12" fill="#38bdf8"/>
  <text x="290" y="280" text-anchor="middle" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="28" font-weight="700">29.72%</text>
  <text x="590" y="442" text-anchor="middle" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="28" font-weight="700">5.45%</text>
  <text x="290" y="548" text-anchor="middle" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="19">characters</text>
  <text x="590" y="548" text-anchor="middle" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="19">tokens</text>
  <text x="72" y="620" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Meaning-unit coverage</text>
  <text x="72" y="654" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="17">Before → after compression</text>
  <text x="450" y="620" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="18">Llama 3.1 8B</text>
  <text x="450" y="654" fill="#f97316" font-family="system-ui, sans-serif" font-size="18" font-weight="700">89.29% → 73.21%</text>
  <text x="820" y="620" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="18">Qwen 3 14B</text>
  <text x="820" y="654" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">92.86% → 91.07%</text>
</svg>
